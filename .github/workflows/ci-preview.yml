name: Verify and deploy isolated preview
on:
  push:
    branches: [main, master, redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify domain-root artifact
        run: |
          python scripts/build.py
          python scripts/validate.py
          python scripts/browser_test.py
      - name: Verify isolated project-path preview artifact
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python scripts/build.py --base-path "/$REPO_NAME" --site-url "https://$OWNER.github.io" --output dist-preview
          python scripts/validate.py --directory dist-preview
          python scripts/browser_test.py --directory dist-preview
      - name: Retain validation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: reports/
          retention-days: 14
      - name: Upload preview artifact
        if: github.event_name != 'pull_request' && github.repository == 'BillySturate/silas-homepage-preview'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-preview
  preview:
    if: github.event_name != 'pull_request' && github.repository == 'BillySturate/silas-homepage-preview'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
