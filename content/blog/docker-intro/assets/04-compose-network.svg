<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#536579" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="690" rx="24" fill="#ffffff"/>
<text x="48" y="65" font-size="34" font-weight="700" fill="#162b46">04 · Compose：外部访问端口，内部访问服务名</text>
<text x="48" y="104" font-size="21" fill="#536579">课程示例：MongoDB + mongo-express 网页管理端。</text>
<rect x="450" y="160" width="790" height="455" rx="18" fill="#f8fafc" stroke="#d8e2ee" stroke-width="2"/>
<text x="474" y="204" font-size="26" font-weight="600" fill="#162b46" text-anchor="start">Compose 默认网络</text>
<rect x="78" y="275" width="280" height="130" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="102" y="319" font-size="26" font-weight="600" fill="#162b46" text-anchor="start">浏览器</text>
<text x="102" y="358" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">localhost:8081</text>
<rect x="490" y="255" width="305" height="185" rx="18" fill="#f3f7ff" stroke="#d8e2ee" stroke-width="2"/>
<text x="514" y="299" font-size="26" font-weight="600" fill="#2563eb" text-anchor="start">mongo-express</text>
<text x="514" y="338" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">服务名：admin</text>
<text x="514" y="372" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">容器端口：8081</text>
<text x="514" y="406" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">负责显示网页</text>
<rect x="945" y="255" width="255" height="185" rx="18" fill="#eef9f5" stroke="#d8e2ee" stroke-width="2"/>
<text x="969" y="299" font-size="26" font-weight="600" fill="#0f766e" text-anchor="start">MongoDB</text>
<text x="969" y="338" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">服务名：mongo</text>
<text x="969" y="372" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">内部端口：27017</text>
<text x="969" y="406" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">不向宿主机发布</text>
<line x1="358" y1="335" x2="490" y2="335" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="490.0,335.0 475.0,329.0 475.0,341.0" fill="#536579"/>
<text x="424.0" y="320.0" font-size="21" font-weight="400" fill="#536579" text-anchor="middle">8081:8081</text>
<line x1="795" y1="335" x2="945" y2="335" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="945.0,335.0 930.0,329.0 930.0,341.0" fill="#536579"/>
<text x="870.0" y="320.0" font-size="21" font-weight="400" fill="#536579" text-anchor="middle">mongo:27017</text>
<rect x="945" y="495" width="255" height="85" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="969" y="539" font-size="26" font-weight="600" fill="#0f766e" text-anchor="start">mongo_data</text>
<line x1="1072" y1="440" x2="1072" y2="495" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="1072.0,495.0 1078.0,480.0 1066.0,480.0" fill="#536579"/>
<text x="480" y="535" font-size="22" font-weight="600" fill="#162b46" text-anchor="start">admin 用服务名 mongo</text>
<text x="480" y="573" font-size="22" font-weight="400" fill="#536579" text-anchor="start">连接数据库的 27017 端口。</text>
<text x="48" y="660" font-size="22" font-weight="400" fill="#536579" text-anchor="start">只给网页管理端发布端口；数据库通过内部网络连接。</text>
</svg>