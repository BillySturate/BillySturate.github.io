<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#536579" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="650" rx="24" fill="#ffffff"/>
<text x="48" y="65" font-size="34" font-weight="700" fill="#162b46">02 · 端口和目录：都按「外 : 内」记</text>
<text x="48" y="104" font-size="21" fill="#536579">示例：-p 8080:80   -v &quot;$(pwd)/html:/usr/share/nginx/html:ro&quot;</text>
<rect x="48" y="155" width="470" height="395" rx="18" fill="#f8fafc" stroke="#d8e2ee" stroke-width="2"/>
<text x="72" y="199" font-size="26" font-weight="600" fill="#162b46" text-anchor="start">宿主机（你的电脑）</text>
<rect x="760" y="155" width="470" height="395" rx="18" fill="#f3f7ff" stroke="#d8e2ee" stroke-width="2"/>
<text x="784" y="199" font-size="26" font-weight="600" fill="#2563eb" text-anchor="start">Nginx 容器</text>
<rect x="80" y="240" width="405" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="104" y="284" font-size="26" font-weight="600" fill="#162b46" text-anchor="start">浏览器</text>
<text x="104" y="323" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">http://localhost:8080</text>
<rect x="792" y="240" width="405" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="816" y="284" font-size="26" font-weight="600" fill="#162b46" text-anchor="start">Nginx 服务</text>
<text x="816" y="323" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">监听容器内的 80 端口</text>
<line x1="485" y1="290" x2="792" y2="290" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="792.0,290.0 777.0,284.0 777.0,296.0" fill="#536579"/>
<text x="638.5" y="275.0" font-size="21" font-weight="400" fill="#536579" text-anchor="middle">-p 8080:80</text>
<rect x="80" y="405" width="405" height="100" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="104" y="449" font-size="26" font-weight="600" fill="#0f766e" text-anchor="start">本地 html 目录</text>
<text x="104" y="488" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">./html/index.html</text>
<rect x="792" y="405" width="405" height="100" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
<text x="816" y="449" font-size="26" font-weight="600" fill="#0f766e" text-anchor="start">容器内网页目录</text>
<text x="816" y="488" font-size="22" font-weight="400" fill="#162b46" text-anchor="start">/usr/share/nginx/html</text>
<line x1="485" y1="452" x2="792" y2="452" stroke="#536579" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="792.0,452.0 777.0,446.0 777.0,458.0" fill="#536579"/>
<text x="638.5" y="437.0" font-size="21" font-weight="400" fill="#536579" text-anchor="middle">绑定挂载</text>
<text x="48" y="605" font-size="23" font-weight="400" fill="#536579" text-anchor="start">:ro 表示容器只读；你在宿主机修改网页后，容器会直接看到修改。</text>
</svg>